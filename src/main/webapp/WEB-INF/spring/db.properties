# =========================================================================
# DATABASE CONFIGURATION (BINCOM E-COMMERCE)
# =========================================================================
db.driver=com.mysql.cj.jdbc.Driver

# --- [OPTION 1: DYNAMIC CONFIGURATION (RECOMMENDED FOR RENDER & LOCAL FALLBACK) ---
# Automatically reads Environment Variables (DB_URL, DB_USERNAME, DB_PASSWORD).
# Fallbacks to localhost MySQL if environment variables are not set.
db.url=${DB_URL:jdbc:mysql://localhost:3306/ecommerce_db?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&useUnicode=true&characterEncoding=UTF-8&allowPublicKeyRetrieval=true}
db.username=${DB_USERNAME:root}
db.password=${DB_PASSWORD:}

# --- [OPTION 2: DIRECT CLOUD DATABASE CONNECTION] ---
# Uncomment and fill the values below to connect directly to Cloud DB from ANY machine
# (This allows all machines to share the same products, orders, and base64 images instantly).
# -------------------------------------------------------------------------
# db.url=jdbc:mysql://<your-cloud-db-host>:3306/<db-name>?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&useUnicode=true&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
# db.username=<your-cloud-db-username>
# db.password=<your-cloud-db-password>


# Email Configuration (Gmail SMTP)
# TODO: Replace with your real Gmail + App Password
mail.host=smtp.gmail.com
mail.port=587
mail.username=your_email@gmail.com
mail.password=your_app_password
